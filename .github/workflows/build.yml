name: NeoForge build
on:
  push:
    branches: ['26.2', '26.3']
  pull_request:
    branches: ['26.2', '26.3']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Test independent logic and packaging validation
        run: |
          python scripts/run_logic_tests.py
          python -m unittest discover -s scripts/tests -v
      - name: Resolve, compile, test and assemble NeoForge
        run: bash ./gradlew :common:test :neoforge:build --no-daemon --stacktrace
      - name: Verify production JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mc=$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          version=$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          python scripts/verify_artifact.py --minecraft "$mc" "neoforge/build/libs/HealthIndicators-NeoForge-$mc-$version.jar"
      - name: Upload verified build, not runtime certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HealthIndicators-NeoForge-${{ github.sha }}
          if-no-files-found: error
          path: |
            neoforge/build/libs/HealthIndicators-NeoForge-*.jar
            neoforge/build/libs/HealthIndicators-NeoForge-*.jar.sha256
      - name: Upload current test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/logic-tests/reports
            common/build/test-results/test
            neoforge/build/test-results/test
