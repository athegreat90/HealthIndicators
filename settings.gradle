pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'healthindicators'

include 'common'
include 'neoforge'

// Fabric source is retained, but these branches target NeoForge only.
if (providers.gradleProperty('includeFabric').orElse('false').get().toBoolean()) {
    include 'fabric'
}
